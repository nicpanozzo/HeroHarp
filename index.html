<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <title>Duello d'Ance</title>
    <meta name="description" content="Impara l'armonica a colpi di blues: il gioco ascolta la tua armonica dal microfono." />
    <meta name="theme-color" content="#1E1A17" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Duello" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #1e1a17;
      }
      #game {
        width: 100%;
        height: 100%;
      }
      /* sul telefono in verticale il palco è minuscolo: si chiede di girarlo */
      #rotate {
        display: none;
      }
      @media (orientation: portrait) and (max-width: 820px) {
        #rotate {
          display: flex;
          position: fixed;
          inset: 0;
          z-index: 10;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 16px;
          padding: 24px;
          background: #1e1a17;
          color: #f1e4c8;
          font:
            700 22px "Atkinson Hyperlegible",
            Verdana,
            sans-serif;
          text-align: center;
        }
        #rotate span {
          font-size: 64px;
          animation: turn 1.6s ease-in-out infinite;
        }
        @keyframes turn {
          50% {
            transform: rotate(-90deg);
          }
        }
        @media (prefers-reduced-motion: reduce) {
          #rotate span {
            animation: none;
          }
        }
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="rotate" role="status"><span aria-hidden="true">📱</span>Gira il telefono in orizzontale per suonare.<br />Turn your phone sideways to play.</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
